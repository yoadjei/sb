name: digital_sports_scoreboard
description: ArenaBoard Bluetooth operator app for ESP32 sports scoreboards.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  shared_preferences: ^2.3.3
  flutter_bluetooth_serial: ^0.4.0
  permission_handler: ^11.3.1
  google_fonts: ^6.2.1
  flutter_colorpicker: ^1.1.0
  share_plus: ^10.1.2
  intl: ^0.19.0
  uuid: ^4.5.1

# flutter_bluetooth_serial 0.4.0 on pub.dev still uses jcenter() and declares no
# Android namespace, so it cannot be built with Gradle 9 / AGP 8+. third_party
# holds the same package with only those Gradle settings corrected.
dependency_overrides:
  flutter_bluetooth_serial:
    path: third_party/flutter_bluetooth_serial

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  integration_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/images/
